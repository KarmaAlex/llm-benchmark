name: GPT-5 (markdown)
provider: openai
model: gpt-5
# gpt-5 accepts only the default temperature, so supports_temperature below
# keeps this field out of the request. Kept for the ModelConfig contract.
temperature: 1
# Sent as max_completion_tokens (see max_tokens_param); includes reasoning tokens.
max_tokens: 8192
context: 400000
parameters:
  max_tokens_param: max_completion_tokens
  supports_temperature: false
  timeout: 600
  max_retries: 3
sampling:
  reasoning_effort: low
  verbosity: low
supports_tools: true
