[project]
name = "llm-benchmark"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai==2.53.0",
    "llama-cpp-python==0.3.34",
    "PyYAML==6.0.3",
    "python-dotenv==1.2.1",
    "huggingface-hub==1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
